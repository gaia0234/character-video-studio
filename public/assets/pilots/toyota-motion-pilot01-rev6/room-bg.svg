<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F6ECDA"/>
      <stop offset="0.55" stop-color="#EFE3CB"/>
      <stop offset="1" stop-color="#E4D3B4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8BC92"/>
      <stop offset="1" stop-color="#BC9A6E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#FBF4E6"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF6E2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1920" height="740" fill="url(#wall)"/>
  <rect y="740" width="1920" height="340" fill="url(#floor)"/>

  <ellipse cx="560" cy="660" rx="520" ry="330" fill="url(#spot)"/>
  <ellipse cx="1480" cy="400" rx="520" ry="330" fill="#FFFFFF" opacity="0.16" filter="url(#soft)"/>

  <rect x="0" y="740" width="1920" height="16" fill="#B99A70" filter="url(#rough)"/>
  <rect x="0" y="738" width="1920" height="6" fill="#6B533B" opacity="0.55"/>

  <rect x="360" y="70" width="1200" height="490" rx="18" fill="url(#panel)"/>
  <rect x="360" y="70" width="1200" height="490" rx="18" fill="none" stroke="#3A2C21" stroke-width="16" filter="url(#rough)"/>
  <rect x="388" y="98" width="1144" height="434" rx="10" fill="none" stroke="#D9AB56" stroke-width="3" stroke-dasharray="12 10" opacity="0.85"/>
</svg>
